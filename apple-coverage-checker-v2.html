<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="أداة مساعدة لفحص ضمان أجهزة Apple: تحقق من الرقم التسلسلي أو IMEI، ثم انتقل إلى موقع Apple الرسمي لمعرفة حالة التغطية.">
  <title>فاحص ضمان Apple | التحقق من التغطية</title>
  <style>
    :root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--blue:#0071e3;--blue-hover:#0077ed;--line:#d2d2d7;--soft:#f0f0f2;--soft2:#f7f7f8;--green:#16834b;--green-bg:#f2fbf5;--green-line:#cfe8d8;--red:#c9342d;--amber:#8a5a00;--amber-bg:#fff7e6;--amber-line:#f2dfb5;--shadow:0 8px 30px rgba(0,0,0,.045)}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--muted:#a1a1a6;--blue:#2997ff;--blue-hover:#4aa8ff;--line:#3a3a3c;--soft:#2c2c2e;--soft2:#242426;--green:#5fd18b;--green-bg:#10261a;--green-line:#1f4a31;--red:#ff6961;--amber:#f5c26b;--amber-bg:#2b2111;--amber-line:#4d3a14;--shadow:none}}
    :root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--muted:#a1a1a6;--blue:#2997ff;--blue-hover:#4aa8ff;--line:#3a3a3c;--soft:#2c2c2e;--soft2:#242426;--green:#5fd18b;--green-bg:#10261a;--green-line:#1f4a31;--red:#ff6961;--amber:#f5c26b;--amber-bg:#2b2111;--amber-line:#4d3a14;--shadow:none}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
    .topbar{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px;background:var(--card);border-bottom:1px solid var(--line)}
    .brand{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
    .brand-mark{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:13px}
    .tools{display:flex;gap:8px}
    .chip{min-height:34px;padding:0 13px;border-radius:999px;background:var(--soft);color:var(--ink);font-size:13px;border:0;font-weight:650;cursor:pointer}
    main{width:min(100% - 32px,720px);margin:46px auto 42px}
    .eyebrow{text-align:center;color:var(--blue);font-size:13px;font-weight:700;margin:0 0 8px}
    h1{text-align:center;font-size:clamp(29px,5vw,43px);line-height:1.2;letter-spacing:-1px;margin:0 0 15px}
    .intro{text-align:center;color:var(--muted);font-size:16px;max-width:570px;margin:0 auto 30px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:var(--shadow);margin-bottom:18px}
    label{display:block;font-weight:650;font-size:15px;margin-bottom:9px}
    input[type=text],input[type=date]{width:100%;height:56px;border:1px solid var(--line);border-radius:12px;padding:0 15px;font:inherit;font-size:17px;outline:none;background:var(--card);color:var(--ink);transition:border .15s,box-shadow .15s}
    #serial{direction:ltr;text-align:left;letter-spacing:.5px;font-variant-ligatures:none}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.18)}
    input.invalid{border-color:var(--red)}
    .meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:8px 2px 0}
    .detect{margin:10px 2px 0;font-size:13px;color:var(--muted);min-height:20px}
    .detect b{color:var(--ink)}
    .error{display:none;color:var(--red);font-size:13px;margin:7px 2px 0}
    .error.show{display:block}
    .actions{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-top:20px}
    button.btn,a.btn{border:0;border-radius:12px;min-height:52px;padding:0 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .primary{background:var(--blue);color:#fff}
    .primary:hover{background:var(--blue-hover)}
    .secondary{background:var(--soft);color:var(--ink)}
    button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid rgba(0,113,227,.4);outline-offset:3px}
    .toast{display:none;margin-top:16px;border:1px solid var(--green-line);background:var(--green-bg);border-radius:12px;padding:13px 14px;color:var(--green);font-size:14px}
    .toast.show{display:block}
    .notice{margin-top:18px;padding:13px 15px;border-radius:12px;background:var(--soft2);color:var(--muted);font-size:13px}
    .notice strong{color:var(--ink)}
    h2{font-size:18px;margin:0 0 10px}
    .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
    .est{display:none;margin-top:14px;padding:13px 15px;border-radius:12px;border:1px solid var(--amber-line);background:var(--amber-bg);color:var(--amber);font-size:14px}
    .est.show{display:block}
    .est small{display:block;margin-top:4px;opacity:.9}
    .hist-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .switch{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:0;cursor:pointer}
    .switch input{width:18px;height:18px;accent-color:var(--blue)}
    .hist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
    .hist li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft2);border-radius:10px;padding:8px 12px}
    .hist code{direction:ltr;unicode-bidi:embed;font-size:14px}
    .hist button{border:0;background:transparent;color:var(--blue);font:inherit;font-size:13px;font-weight:650;cursor:pointer;padding:4px 8px}
    .hist .del{color:var(--red)}
    details{border-top:1px solid var(--line);padding:12px 0}
    details:first-of-type{border-top:0}
    summary{cursor:pointer;font-weight:650;font-size:15px}
    details p{margin:8px 0 2px;color:var(--muted);font-size:14px}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
    .step{background:var(--soft2);border-radius:12px;padding:13px;font-size:13px;color:var(--muted)}
    .num{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:rgba(0,113,227,.14);color:var(--blue);font-weight:700;margin-bottom:7px}
    .links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:24px 0 0}
    .links a{color:var(--blue);text-decoration:none;font-size:13px}
    .links a:hover{text-decoration:underline}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:0 18px 28px}
    @media(max-width:560px){main{margin-top:32px}.actions{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.step{display:flex;align-items:center;gap:10px}.num{margin:0;flex:0 0 25px}.intro{font-size:14px}.brand span.t{display:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">A</span><span class="t" data-i18n="brand"></span></div>
    <div class="tools">
      <button class="chip" id="themeBtn" type="button" aria-label="theme"></button>
      <button class="chip" id="langBtn" type="button" aria-label="language">English</button>
    </div>
  </header>

  <main>
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="h1"></h1>
    <p class="intro" data-i18n="intro"></p>

    <section class="panel" aria-labelledby="form-title">
      <form id="coverageForm" novalidate>
        <label id="form-title" for="serial" data-i18n="label"></label>
        <input id="serial" name="serial" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" aria-describedby="serialHint serialDetect serialError">
        <div class="meta"><span id="serialHint" data-i18n="hint"></span><span id="count" dir="ltr">0</span></div>
        <p class="detect" id="serialDetect" aria-live="polite"></p>
        <p class="error" id="serialError" role="alert"></p>

        <div class="actions">
          <button class="btn primary" type="submit"><span data-i18n="open"></span> <span aria-hidden="true" class="arrow">←</span></button>
          <button class="btn secondary" type="button" id="copyBtn" data-i18n="copy"></button>
          <button class="btn secondary" type="button" id="clearBtn" data-i18n="clear"></button>
        </div>
      </form>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="notice"><strong data-i18n="noticeT"></strong> <span data-i18n="notice"></span></div>
    </section>

    <section class="panel" aria-labelledby="est-title">
      <h2 id="est-title" data-i18n="estTitle"></h2>
      <p class="sub" data-i18n="estSub"></p>
      <label for="buyDate" data-i18n="buyLabel"></label>
      <input id="buyDate" type="date">
      <div class="est" id="est" role="status" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="hist-title">
      <div class="hist-head">
        <h2 id="hist-title" style="margin:0" data-i18n="histTitle"></h2>
        <label class="switch"><input type="checkbox" id="histToggle"><span data-i18n="histToggle"></span></label>
      </div>
      <p class="sub" style="margin-top:8px" data-i18n="histSub"></p>
      <ul class="hist" id="histList"></ul>
    </section>

    <section class="panel" aria-labelledby="help-title">
      <h2 id="help-title" data-i18n="helpTitle"></h2>
      <details open><summary data-i18n="d1"></summary><p data-i18n="d1t"></p></details>
      <details><summary data-i18n="d2"></summary><p data-i18n="d2t"></p></details>
      <details><summary data-i18n="d3"></summary><p data-i18n="d3t"></p></details>
      <details><summary data-i18n="d4"></summary><p data-i18n="d4t"></p></details>
      <details><summary data-i18n="d5"></summary><p data-i18n="d5t"></p></details>
      <div class="steps">
        <div class="step"><span class="num">1</span><span data-i18n="s1"></span></div>
        <div class="step"><span class="num">2</span><span data-i18n="s2"></span></div>
        <div class="step"><span class="num">3</span><span data-i18n="s3"></span></div>
      </div>
    </section>

    <nav class="links" aria-label="links">
      <a href="https://checkcoverage.apple.com/" target="_blank" rel="noopener noreferrer" data-i18n="l1"></a>
      <a href="https://support.apple.com/en-eg/102865" target="_blank" rel="noopener noreferrer" data-i18n="l2"></a>
      <a href="https://support.apple.com/en-eg/HT204308" target="_blank" rel="noopener noreferrer" data-i18n="l3"></a>
    </nav>
  </main>

  <footer data-i18n="footer"></footer>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const APPLE_URL = 'https://checkcoverage.apple.com/';
      const T = {
        ar: {
          brand:'فاحص ضمان Apple', eyebrow:'أداة مساعدة مجانية', h1:'تحقق من ضمان جهاز Apple',
          intro:'أدخل الرقم التسلسلي أو رقم IMEI لجهازك، ثم انتقل إلى صفحة Apple الرسمية لمعرفة حالة الضمان والتغطية وخيارات AppleCare.',
          label:'الرقم التسلسلي أو IMEI', hint:'الصق النص كما هو؛ سنستخرج الرقم تلقائياً.',

          noticeT:'تنبيه للشفافية:', notice:'هذه أداة مستقلة وليست تابعة لشركة Apple، ولا تتصل بقاعدة بياناتها، لذلك لا تعرض حالة ضمان. يُفتح موقع Apple الرسمي لإظهار النتيجة الحقيقية. لا يُرسل الرقم إلى أي خادم من طرفنا.',
          errFormat:'أدخل رقماً تسلسلياً (8 إلى 24 حرفاً وأرقاماً) أو IMEI من 15 رقماً.',
          errImei:'رقم IMEI غير صحيح (فشل اختبار رقم التحقق). راجع الأرقام.',
          dImei:'تم التعرف عليه كـ <b>IMEI</b> صالح.',
          dSerial:'تم التعرف عليه كـ <b>رقم تسلسلي</b>.',
          d12:'12 خانة: صيغة تقليدية شائعة في أجهزة iPhone وiPad وMac.',
          d11:'11 خانة: صيغة أقدم لدى بعض الأجهزة.',
          d10:'10 خانات: صيغة عشوائية تستخدمها Apple في بعض المنتجات الأحدث.',
          dOther:'الطول غير معتاد؛ تأكد من نسخ الرقم كاملاً (Apple هي الحكم النهائي).',
          dHint:'تلميح فقط: صيغة الرقم لا تحدد الطراز بدقة.',
          copied:'تم نسخ الرقم. الصقه في خانة الرقم التسلسلي بصفحة Apple (قد تطلب رمز تحقق مرئي).',
          copiedOnly:'تم نسخ الرقم إلى الحافظة.',
          manual:'تعذّر النسخ تلقائياً. حدّد الرقم وانسخه يدوياً ثم افتح صفحة Apple.',
          estTitle:'تقدير تاريخ انتهاء الضمان المحدود', estSub:'اختياري: أدخل تاريخ الشراء لحساب تقدير تقريبي بمدة سنة واحدة.',
          buyLabel:'تاريخ الشراء',
          estLeft:(d,date)=>`تقدير: ينتهي الضمان المحدود بتاريخ <b>${date}</b> (متبقٍ نحو ${d} يوماً).`,
          estEnd:(d,date)=>`تقدير: انتهى الضمان المحدود بتاريخ <b>${date}</b> (منذ ${d} يوماً).`,
          estToday:(date)=>`تقدير: ينتهي الضمان المحدود اليوم <b>${date}</b>.`,
          estNote:'هذا حساب تقريبي على أساس سنة واحدة من تاريخ الشراء. قد يختلف تاريخ البدء والمدة حسب الدولة والبائع وAppleCare، والمرجع الوحيد هو موقع Apple.',
          estFuture:'تاريخ الشراء في المستقبل؛ راجع التاريخ.',
          histTitle:'آخر الأرقام', histToggle:'حفظ على هذا الجهاز',
          histSub:'معطّل افتراضياً. عند تفعيله تُحفظ آخر 5 أرقام في متصفحك فقط، ويمكنك حذفها في أي وقت.',
          histEmpty:'لا توجد أرقام محفوظة.', use:'استخدام', del:'حذف',
          helpTitle:'أين تجد الرقم التسلسلي؟',
          d1:'iPhone وiPad', d1t:'الإعدادات ← عام ← حول. يظهر الرقم التسلسلي ورقم IMEI في الصفحة نفسها، ويمكنك الضغط مطولاً على الرقم لنسخه.',
          d2:'Mac', d2t:'قائمة Apple ← حول هذا الـ Mac. الرقم مطبوع أيضاً أسفل الجهاز.',
          d3:'Apple Watch', d3t:'الإعدادات ← عام ← حول، أو من تطبيق Watch على iPhone ← عام ← حول.',
          d4:'AirPods', d4t:'بعد توصيلها: الإعدادات ← Bluetooth ← زر المعلومات بجوار AirPods. وقد يكون مطبوعاً أيضاً على العلبة أو داخل الغطاء بحسب الطراز.',
          d5:'جهاز لا يعمل أو لا أملك الوصول إليه', d5t:'ابحث عن الرقم على العبوة الأصلية أو الفاتورة، أو على الجهاز نفسه، أو سجّل الدخول إلى حساب Apple في صفحة الأجهزة.',
          s1:'أدخل الرقم في الحقل بالأعلى.', s2:'افتح صفحة الفحص الرسمية والصق الرقم.', s3:'أكمل التحقق واقرأ تفاصيل التغطية من Apple.',
          l1:'موقع Apple لفحص التغطية', l2:'معلومات ضمان Apple', l3:'طريقة العثور على الرقم التسلسلي',
          footer:'أداة مستقلة غير معتمدة أو مدعومة من Apple Inc. جميع العلامات التجارية مملوكة لأصحابها.',
          themeAuto:'تلقائي', themeLight:'فاتح', themeDark:'داكن', arrow:'←', locale:'ar-EG'
        },
        en: {
          brand:'Apple Coverage Checker', eyebrow:'Free helper tool', h1:'Check your Apple device coverage',
          intro:'Enter your device serial number or IMEI, then continue to Apple’s official page to see warranty status, coverage and AppleCare options.',
          label:'Serial number or IMEI', hint:'Paste the text as is; we will extract the number.',
          ph:'e.g. F2LXXXXXXXXX', open:'Continue to Apple’s official check', copy:'Copy', clear:'Clear',
          noticeT:'Transparency note:', notice:'This is an independent tool, not affiliated with Apple, and it has no access to Apple’s database, so it never shows a warranty status. Apple’s official site is opened to show the real result. The number is not sent to any server by us.',
          errFormat:'Enter a serial number (8–24 letters/digits) or a 15-digit IMEI.',
          errImei:'This IMEI looks invalid (check digit failed). Please re-check the digits.',
          dImei:'Recognized as a valid <b>IMEI</b>.', dSerial:'Recognized as a <b>serial number</b>.',
          d12:'12 characters: a traditional format common on iPhone, iPad and Mac.',
          d11:'11 characters: an older format used by some devices.',
          d10:'10 characters: a randomized format Apple uses on some newer products.',
          dOther:'Unusual length; make sure you copied the whole number (Apple has the final say).',
          dHint:'Hint only: the format cannot reliably identify the model.',
          copied:'Number copied. Paste it into the serial number field on Apple’s page (a visual verification code may be required).',
          copiedOnly:'Number copied to clipboard.',
          manual:'Automatic copy failed. Select and copy the number manually, then open Apple’s page.',
          estTitle:'Estimated limited-warranty end date', estSub:'Optional: enter your purchase date for a rough one-year estimate.',
          buyLabel:'Purchase date',
          estLeft:(d,date)=>`Estimate: limited warranty ends on <b>${date}</b> (about ${d} days left).`,
          estEnd:(d,date)=>`Estimate: limited warranty ended on <b>${date}</b> (${d} days ago).`,
          estToday:(date)=>`Estimate: limited warranty ends today, <b>${date}</b>.`,
          estNote:'This is a rough one-year calculation from the purchase date. Start date and length can vary by country, seller and AppleCare; Apple’s site is the only authority.',
          estFuture:'The purchase date is in the future; please check it.',
          histTitle:'Recent numbers', histToggle:'Save on this device',
          histSub:'Off by default. When on, the last 5 numbers are kept in your browser only, and you can delete them anytime.',
          histEmpty:'No saved numbers.', use:'Use', del:'Delete',
          helpTitle:'Where do I find the serial number?',
          d1:'iPhone and iPad', d1t:'Settings → General → About. The serial number and IMEI appear on the same page; touch and hold a number to copy it.',
          d2:'Mac', d2t:'Apple menu → About This Mac. It is also printed on the underside of the device.',
          d3:'Apple Watch', d3t:'Settings → General → About, or in the Watch app on iPhone → General → About.',
          d4:'AirPods', d4t:'After connecting: Settings → Bluetooth → the info button next to AirPods. It may also be printed on the case or inside the lid, depending on the model.',
          d5:'Device that won’t turn on or that I can’t access', d5t:'Look on the original box or invoice, on the device itself, or sign in to your Apple Account’s devices page.',
          s1:'Enter the number in the field above.', s2:'Open Apple’s official page and paste it.', s3:'Complete verification and read the coverage details from Apple.',
          l1:'Apple coverage check', l2:'Apple warranty information', l3:'How to find your serial number',
          footer:'Independent tool, not endorsed by or affiliated with Apple Inc. All trademarks belong to their owners.',
          themeAuto:'Auto', themeLight:'Light', themeDark:'Dark', arrow:'→', locale:'en-GB'
        }
      };

      let lang = 'ar';
      let theme = 'auto';
      const store = {
        get(k){ try { return localStorage.getItem(k); } catch { return null; } },
        set(k,v){ try { localStorage.setItem(k,v); } catch {} },
        del(k){ try { localStorage.removeItem(k); } catch {} }
      };

      const serial = $('serial'), err = $('serialError'), det = $('serialDetect'), toast = $('toast');
      const countEl = $('count'), form = $('coverageForm');

      /* ---------- helpers ---------- */
      function extract(raw) {
        const s = String(raw || '').toUpperCase();
        // IMEI may be pasted with separators like 35-123456-123456-7 or spaces
        const digitsOnly = s.replace(/[\s\-\/.]/g, '');
        if (/^\d{15}$/.test(digitsOnly)) return digitsOnly;
        // remove common labels (Serial Number:, S/N, IMEI ...) then compact
        const cleaned = s.replace(/(SERIAL\s*(NUMBER|NO\.?)?|S\/N|IMEI|الرقم\s*التسلسلي)\s*[:：]?/g, ' ');
        const tokens = cleaned.match(/[A-Z0-9]{8,24}/g);
        if (tokens && tokens.length) return tokens[0];
        return s.replace(/[^A-Z0-9]/g, '');
      }
      function luhn(num) {
        let sum = 0, alt = false;
        for (let i = num.length - 1; i >= 0; i--) {
          let n = num.charCodeAt(i) - 48;
          if (alt) { n *= 2; if (n > 9) n -= 9; }
          sum += n; alt = !alt;
        }
        return sum % 10 === 0;
      }
      function classify(v) {
        if (!v) return {kind:'empty'};
        if (/^\d{15}$/.test(v)) return luhn(v) ? {kind:'imei'} : {kind:'badimei'};
        if (/^[A-Z0-9]{8,24}$/.test(v)) return {kind:'serial'};
        return {kind:'bad'};
      }
      function currentValue() { return extract(serial.value); }

      /* ---------- i18n ---------- */
      function applyLang() {
        const t = T[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const v = t[el.dataset.i18n];
          if (typeof v === 'string') el.textContent = v;
        });
        serial.placeholder = t.ph;
        document.querySelector('.arrow').textContent = t.arrow;
        $('langBtn').textContent = lang === 'ar' ? 'English' : 'العربية';
        applyTheme(theme);
        refreshDetect(); renderEst(); renderHist();
        toast.classList.remove('show');
      }
      function applyTheme(mode) {
        theme = mode;
        const r = document.documentElement;
        if (mode === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', mode);
        const t = T[lang];
        $('themeBtn').textContent = mode === 'auto' ? t.themeAuto : mode === 'light' ? t.themeLight : t.themeDark;
      }

      /* ---------- detect / validate ---------- */
      function refreshDetect() {
        const t = T[lang], v = currentValue(), c = classify(v);
        countEl.textContent = v.length;
        err.classList.remove('show'); serial.classList.remove('invalid');
        if (c.kind === 'imei') det.innerHTML = t.dImei;
        else if (c.kind === 'serial') {
          const m = {12:t.d12, 11:t.d11, 10:t.d10}[v.length] || t.dOther;
          det.innerHTML = t.dSerial + ' ' + m + (m !== t.dOther ? ' <span>' + t.dHint + '</span>' : '');
        } else det.textContent = '';
      }
      function showError(msg) {
        err.textContent = msg; err.classList.add('show'); serial.classList.add('invalid'); serial.focus();
      }
      function validate() {
        const t = T[lang], v = currentValue(), c = classify(v);
        if (c.kind === 'badimei') { showError(t.errImei); return null; }
        if (c.kind !== 'imei' && c.kind !== 'serial') { showError(t.errFormat); return null; }
        return v;
      }
      function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); }

      async function copyText(v) {
        try {
          if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(v); return true; }
        } catch {}
        return false;
      }

      /* ---------- history (opt-in, local only) ---------- */
      function getHist() { try { return JSON.parse(store.get('acc_hist') || '[]'); } catch { return []; } }
      function pushHist(v) {
        if (store.get('acc_hist_on') !== '1') return;
        const h = getHist().filter(x => x !== v); h.unshift(v);
        store.set('acc_hist', JSON.stringify(h.slice(0, 5))); renderHist();
      }
      function renderHist() {
        const t = T[lang], list = $('histList'), on = store.get('acc_hist_on') === '1';
        $('histToggle').checked = on;
        list.textContent = '';
        const h = on ? getHist() : [];
        if (!h.length) { const li = document.createElement('li'); li.textContent = t.histEmpty; list.appendChild(li); return; }
        h.forEach(v => {
          const li = document.createElement('li');
          const code = document.createElement('code'); code.textContent = v;
          const box = document.createElement('span');
          const use = document.createElement('button'); use.type = 'button'; use.textContent = t.use;
          use.onclick = () => { serial.value = v; refreshDetect(); serial.focus(); };
          const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = t.del;
          del.onclick = () => { store.set('acc_hist', JSON.stringify(getHist().filter(x => x !== v))); renderHist(); };
          box.append(use, del); li.append(code, box); list.appendChild(li);
        });
      }

      /* ---------- warranty estimate ---------- */
      function renderEst() {
        const t = T[lang], box = $('est'), val = $('buyDate').value;
        if (!val) { box.classList.remove('show'); return; }
        const [y, m, d] = val.split('-').map(Number);
        const buy = new Date(y, m - 1, d);
        const today = new Date(); today.setHours(0, 0, 0, 0);
        if (buy > today) { box.innerHTML = t.estFuture; box.classList.add('show'); return; }
        const end = new Date(y + 1, m - 1, d);
        const fmt = end.toLocaleDateString(t.locale, {year:'numeric', month:'long', day:'numeric'});
        const diff = Math.round((end - today) / 86400000);
        let line = diff > 0 ? t.estLeft(diff, fmt) : diff === 0 ? t.estToday(fmt) : t.estEnd(-diff, fmt);
        box.innerHTML = line + '<small>' + t.estNote + '</small>';
        box.classList.add('show');
      }

      /* ---------- events ---------- */
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        toast.classList.remove('show');
        const v = validate(); if (!v) return;
        serial.value = v; refreshDetect();
        // call clipboard synchronously inside the user gesture, then open the tab
        const copying = copyText(v);
        const opened = window.open(APPLE_URL, '_blank', 'noopener,noreferrer');
        pushHist(v);
        copying.then(ok => showToast(ok ? T[lang].copied : T[lang].manual));
        if (!opened) window.location.href = APPLE_URL;
      });
      $('copyBtn').addEventListener('click', async () => {
        const v = validate(); if (!v) return;
        serial.value = v; refreshDetect();
        showToast((await copyText(v)) ? T[lang].copiedOnly : T[lang].manual);
      });
      $('clearBtn').addEventListener('click', () => {
        form.reset(); refreshDetect(); toast.classList.remove('show'); serial.focus();
      });
      serial.addEventListener('input', () => { toast.classList.remove('show'); refreshDetect(); });
      serial.addEventListener('paste', () => {
        setTimeout(() => {
          const v = currentValue();
          if (v) { serial.value = v; refreshDetect(); }
        }, 0);
      });
      $('buyDate').max = new Date().toISOString().slice(0, 10);
      $('buyDate').addEventListener('input', renderEst);
      $('histToggle').addEventListener('change', (e) => {
        if (e.target.checked) store.set('acc_hist_on', '1');
        else { store.del('acc_hist_on'); store.del('acc_hist'); }
        renderHist();
      });
      $('langBtn').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set('acc_lang', lang); applyLang(); });
      $('themeBtn').addEventListener('click', () => {
        const next = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto';
        store.set('acc_theme', next); applyTheme(next);
      });

      /* ---------- init ---------- */
      const sl = store.get('acc_lang'); if (sl === 'ar' || sl === 'en') lang = sl;
      else if (!/^ar/i.test(navigator.language || 'ar')) lang = 'en';
      const st = store.get('acc_theme'); if (['auto', 'light', 'dark'].includes(st)) theme = st;
      applyLang();

      // expose pure helpers for testing in non-browser environments
      if (typeof window !== 'undefined') window.__acc = { extract, luhn, classify };
    })();
  </script>
</body>
</html>
